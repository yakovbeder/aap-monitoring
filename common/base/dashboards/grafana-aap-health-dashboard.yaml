    {
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": { "type": "datasource", "uid": "grafana" },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "limit": 100,
              "name": "Annotations & Alerts",
              "showIn": 0,
              "target": { "limit": 100, "matchAny": false, "tags": [], "type": "dashboard" },
              "type": "dashboard"
            }
          ]
        },
        "description": "Comprehensive health and monitoring dashboard for Ansible Automation Platform. Covers component readiness, service accessibility, job status, latency, and resource usage.",
