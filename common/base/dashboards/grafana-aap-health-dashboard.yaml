              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [
                  { "options": { "0": { "color": "red", "index": 0, "text": "CRITICAL" } }, "type": "value" },
                  { "options": { "1": { "color": "green", "index": 1, "text": "HEALTHY" } }, "type": "value" }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "red", "value": null },
                    { "color": "yellow", "value": 0.01 },
                    { "color": "green", "value": 1 }
                  ]
                },
                "unit": "percentunit",
                "noValue": "N/A",
                "min": 0,
                "max": 1
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 5, "x": 0, "y": 1 },
            "id": 101,
