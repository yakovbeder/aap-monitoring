        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "collapsed": false,
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
            "id": 100,
            "panels": [],
            "title": "AAP Platform Components",
            "type": "row"
          },
          {
            "datasource": { "type": "prometheus" },
            "description": "The platform gateway is the single entry point for all AAP traffic (UI, API, SSO). If this is down, the entire platform is unreachable.",
            "fieldConfig": {
              "defaults": {
                "color": { "mode": "thresholds" },
                "mappings": [
                  { "options": { "0": { "color": "red", "index": 0, "text": "CRITICAL" } }, "type": "value" },
                  { "options": { "1": { "color": "green", "index": 1, "text": "HEALTHY" } }, "type": "value" }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "red", "value": null },
                    { "color": "yellow", "value": 0.01 },
                    { "color": "green", "value": 1 }
                  ]
                },
                "unit": "percentunit",
                "noValue": "N/A",
                "min": 0,
                "max": 1
              },
              "overrides": []
            },
            "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
            "id": 101,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "auto",
              "orientation": "auto",
              "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
              "textMode": "auto"
            },
            "targets": [
              {
                "datasource": { "type": "prometheus" },
                "editorMode": "code",
                "expr": "sum(kube_deployment_status_replicas_available{namespace=~\"$namespace\", deployment=~\".*-gateway\"}) / sum(kube_deployment_spec_replicas{namespace=~\"$namespace\", deployment=~\".*-gateway\"})",
