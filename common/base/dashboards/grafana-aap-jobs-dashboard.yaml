          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aap-postgres"
          },
          "description": "Recent unified jobs filtered by status and job template. Hosts is the count of main_jobhostsummary rows (0 means no per-host drill-down). Click a Job ID to select it and load host results / failed messages below.",
