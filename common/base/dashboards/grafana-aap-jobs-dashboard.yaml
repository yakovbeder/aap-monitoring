                            "index": 3,
                            "text": "canceled"
                          },
                          "running": {
                            "color": "blue",
                            "index": 4,
                            "text": "running"
                          },
                          "pending": {
                            "color": "yellow",
                            "index": 5,
                            "text": "pending"
                          },
                          "waiting": {
                            "color": "yellow",
                            "index": 6,
                            "text": "waiting"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "true": {
                            "color": "red",
                            "index": 0,
                            "text": "true"
                          },
                          "false": {
                            "color": "green",
                            "index": 1,
                            "text": "false"
