                        "type": "value",
                        "options": {
                          "successful": {
                            "color": "green",
                            "index": 0,
                            "text": "successful"
                          },
                          "failed": {
                            "color": "red",
                            "index": 1,
                            "text": "failed"
                          },
                          "error": {
                            "color": "red",
                            "index": 2,
                            "text": "error"
                          },
                          "canceled": {
