            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Job ID"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Select job",
                        "url": "/d/${__dashboard.uid}/${__dashboard}?${job_status:queryparam}&${job_template:queryparam}&var-job_id=${__value.raw}&var-host_name=All"
                      }
                    ]
                  }
                ]
              },
