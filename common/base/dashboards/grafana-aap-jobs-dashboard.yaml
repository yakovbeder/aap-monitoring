            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aap-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  uj.id AS \"Job ID\",\n  uj.name AS \"Job Name\",\n  ujt.name AS \"Template\",\n  uj.status AS \"Status\",\n  uj.failed AS \"Failed\",\n  uj.launch_type AS \"Launch Type\",\n  COUNT(jhs.id) AS \"Hosts\",\n  uj.started AS \"Started\",\n  uj.finished AS \"Finished\"\nFROM main_unifiedjob uj\nLEFT JOIN main_unifiedjobtemplate ujt\n  ON uj.unified_job_template_id = ujt.id\nLEFT JOIN main_jobhostsummary jhs\n  ON jhs.job_id = uj.id\nWHERE uj.status IN (${job_status:sqlstring})\n  AND (\n    ${job_template} = -1\n    OR uj.unified_job_template_id IN (${job_template})\n  )\nGROUP BY uj.id, uj.name, ujt.name, uj.status, uj.failed, uj.launch_type, uj.started, uj.finished\nORDER BY uj.started DESC NULLS LAST\nLIMIT 200;",
              "refId": "A"
            }
          ],
          "title": "Jobs",
          "type": "table"
